[Service]
# Event log on durable storage (data/). Originally tmpfs (/run/volthium)
# because the old SU16G SD card couldn't sustain the write rate; the
# 2026-07-09 Samsung PRO Endurance upgrade removed that constraint, and the
# 2026-07-12/13 outage showed why durability matters: wedge evidence must
# survive reboots and crash loops. Sealed-segment rotation is unchanged.
Environment="VOLTHIUM_BLE_EVENT_LOG=/srv/volthium_reader/data/ble_events.jsonl"

# Pin the reader to the TP-Link UB500 by BD address (whichever hci* index it
# lands on this boot). See volthium/pack.py::_AdapterManager.
Environment="VOLTHIUM_ADAPTER=20:E1:5D:68:30:8B"

# Fallback: the internal BCM43438. Used automatically while the UB500 is
# unusable (flaky, but degraded data beats no data); the reader switches
# back and powers this down as soon as the UB500 recovers.
Environment="VOLTHIUM_FALLBACK_ADAPTER=B8:27:EB:37:69:FD"

# USB VID:PID of the primary dongle, for the recovery ladder's replug rung
# (matches the default in volthium/pack.py; explicit for self-documentation).
Environment="VOLTHIUM_ADAPTER_USB_ID=2357:0604"

# VOLTHIUM_CAPTURE_RAW stays off in prod — see data/simulator/ corpus notes.
