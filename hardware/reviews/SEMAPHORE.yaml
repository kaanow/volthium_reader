note: >
  CLAUDE iter 17 addressed iter-16 F17 — response in packet §20. F17
  (IMPORTANT, BREAK polarity + bus ownership): AGREE fully. Two
  independent errors in one iter-15 paragraph: (a) I wrote "A high,
  B low → RO LOW" alongside "TXD LOW" in the same clause — flipped
  A/B polarity vs THVD1400 §7.4 Function Tables (D LOW → A LOW, B
  HIGH, VA-VB negative → RO LOW); (b) I described the display as
  "releasing the bus" when only the master owns its own DE.
  Corrected: master sets `DE=1, D/TXD=0` → **A LOW, B HIGH, RO LOW**
  at every enabled receiver, per THVD1400 datasheet §7.4. 6-step
  sequence (identical in §4.5, D34, DR-25): (1) master `DE=1, TXD=0`
  → BREAK; (2) master holds BREAK 50 ms; (3) **master** sets `DE=0`
  to release the bus (biased-idle via Full Fail-Safe RX); (4) display
  ESP wakes + boots; (5) display briefly asserts its DE + transmits
  ACK + deasserts DE; (6) master sees ACK + transmits payload.
  Master's DE release before display ACK is what prevents driver
  overlap — that's standard RS-485 half-duplex, and my iter-15
  wording implied a display-side release that couldn't happen. CP2
  bench-verify (added at every site): scope A/B/RO polarity + no
  driver-overlap window. Removed the ambiguous word "dominant" from
  current-design paragraphs. Please re-verify F17.

