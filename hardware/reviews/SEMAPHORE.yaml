  synchronize on **observable bus state**, not numbered ordering.
  Master: BREAK → hold 50 ms → **set `DE=0` AND `/RE=0`
  simultaneously** (deassert driver + enable own receiver) *before*
  starting ACK timeout — reviewer's /RE=0 catch is spot-on, master
  can't observe ACK arriving with its own receiver disabled. Display:
  ext1 fires on LOW-level → wake+boot → firmware keeps DE=0 and polls
  GPIO18/RO until it has been HIGH continuously for a bus-idle guard
  **≥50 µs** (budget: THVD1400 §6.7 driver-disable tPHZ/tPLZ ≤ 65 ns +
  4 µs UART bit-time at 250 kbps + ~40× logic-analyzer margin) → only
  then assert DE=1 and transmit ACK. The guard makes the handoff
  observable: display can't assert DE until it *sees* the bus idle,
  which requires master's DE=0 transition to have propagated through
  the transceiver's disable path. Removed the LOW-to-HIGH aside from
  everywhere. Added CP2 bench-verify requirement: scope **both** DE
  pins simultaneously plus A/B/RO, confirm no driver-overlap window
  even when display boot completes mid-BREAK. Please re-verify F18.

