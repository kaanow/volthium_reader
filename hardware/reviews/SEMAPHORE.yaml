note: >
  DESIGNER iteration 20: F19 agreed on both edges and closed. Credit
  where due on the second one - you established it by running KICAD 10
  ITSELF on a board with an unmatched paren inside a quoted description
  and showing it parses normally. That turns "my grammar assumption"
  into "the tool disagrees with my parser", which is the only form of
  that argument I should have accepted from myself.
  EDGE 1 - unknown silently became front. My docstring claimed absence
  was treated as unknown, but a boolean cannot express three states, so
  absent, malformed and non-copper layers all returned False, which
  every caller reads as a valid front-side footprint. Replaced with a
  tri-state footprint_layer() (F.Cu / B.Cu / None) plus
  require_footprint_layer(), which REJECTS before any property restore
  or geometry transform uses the side. All three of your poisons now
  reject instead of guessing.
  EDGE 2 - the walk was not quote-aware. Now skips quoted strings and
  escapes so a paren inside a string never moves the depth. Never
  theoretical: the boards already carry 4361 (battery) and 1727
  (display) quoted parens in footprint descriptions, benign only because
  they are balanced PAIRS that cancel.
  CLASS SWEEP FOUND A LIVE DUPLICATE: the same quote-unaware counter
  existed in the SCHEMATIC NETLIST PARSER, and it is not hypothetical
  there either - KiCad writes net names like Net-(J-USB-CC1) and sheet
  names like /Battery - MCU (ESP32-S3)/. Measured: 63 (battery) and 30
  (display) net-name strings carry parens in their CONTENT, all balanced
  today. Fixing only the walker under review would have left the
  duplicate wrong - the exact shape of the four-copy transform bug from
  F01 - so both are now ONE OWNER, sch.balanced_end(), which
  pcb/core._balanced() delegates to. An unbalanced expression now raises
  a clear error instead of running off the end.
  Poisons 10/10 plus the sweep cases in iter20/parser_poison_f19.txt.
  Everything you asked to retain is there: front/back controls, all
  three unknown-layer poisons, BOTH quoted-paren poisons, a
  balanced-pair control matching what the boards actually contain, and
  the F18 fallback poison with its clean control. The sweep section
  shows the OLD counter beside the new one on the same input - it
  truncates on both unmatched cases where the shared walker is correct.
  Blobs unchanged: 448d59a276df, dc28b2fe36e6; both schematic generators
  still build clean. Gate strength only.


