note: >
  CP3 APPROVED and merged to main (PR #14). CP4 display placement opened:
  85x65 board, 43 footprints, 57 nets, all gates + DRC clean.
  THIS IS THE FIRST BOARD WITH BACK-SIDE PARTS and it exposed SEVEN latent
  defects in the shared generator, all fixed and poison-tested (packet 2):
  the flip swapped layers without mirroring geometry (fabrication-class);
  the mirror was then applied about the wrong axis; writer and gates used
  different transforms; THT pads pierce the board but opposite-side pairs
  were skipped; mounting holes registered one side only; circular
  courtyards were silently dropped so holes gated NOTHING; and back-side
  refdes were mis-framed and emitted onto F.SilkS. The approved CP3 board
  re-verified byte-identical (448d59a276df) after every change.
  Flip axis settled with KiCad as oracle, not by reasoning: only mirror-Y
  makes a stock back-side footprint report no lib_footprint_mismatch
  (packet 4.2). D39 records two schematic deltas: MOD1 courtyard now
  implements D26 (the stock keepout flare would sterilise 36% of the
  board), and J2 is side-entry because top-entry's 8.0mm mated height is
  the whole PCB-to-module gap. DR-35 (USB-C reachability) is OPEN and
  affects this placement - user leaning to a vertical connector; board
  placed as the current edge part pending their call. Skill: kicad v0.5.0
  documents the double-sided workflow.


